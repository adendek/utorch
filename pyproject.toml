[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "utorch"
version = "0.1.0"
description = "A minimalist educational deep learning library and autograd engine built from scratch in Python."
readme = "README.md"
requires-python = ">=3.13"
license = { text = "MIT" }
authors = [
    { name = "utorch contributors" }
]
keywords = ["autograd", "deep-learning", "pytorch", "neural-networks", "education"]
dependencies = [
    "numpy>=2.0.0",
]

[project.optional-dependencies]
viz = [
    "graphviz>=0.20.0",
    "matplotlib>=3.8.0",
]

[dependency-groups]
dev = [
    "commitizen>=4.8.2",
    "mypy>=1.16.0",
    "pre-commit>=4.2.0",
    "pytest>=8.3.5",
    "pytest-cov>=5.0.0",
    "ruff>=0.11.11",
    "mkdocs>=1.6.1",
    "mkdocs-material>=9.6.14",
    "mkdocstrings[python]>=0.28.0",
]

# Configure hatch to find the flat 'utorch' package in repo root
[tool.hatch.build.targets.wheel]
packages = ["utorch"]

# ================================= RUFF
[tool.ruff]
line-length = 88
target-version = "py314"

exclude = [
    ".venv",
    "venv",
    "__pycache__",
    "build",
    "dist",
    ".git",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "N",   # pep8-naming
    "D",   # pydocstyle
    "UP",  # pyupgrade
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
    "RUF", # Ruff-specific rules
]

ignore = [
    "D202",
    "D212",
    "D104",
    "D100",
]

dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.isort]
known-first-party = ["utorch"]
section-order = [
    "future",
    "standard-library",
    "third-party",
    "first-party",
    "local-folder",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

# ================================= MYPY
[tool.mypy]
python_version = "3.14"
strict = true
explicit_package_bases = true
ignore_missing_imports = true
warn_unused_configs = true

# ================================= COMMITIZEN
[tool.commitizen]
name = "cz_conventional_commits"
tag_format = "v$version"
version_scheme = "semver2"
version_provider = "uv"
update_changelog_on_bump = true

# ================================= PYTEST
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra -v"
